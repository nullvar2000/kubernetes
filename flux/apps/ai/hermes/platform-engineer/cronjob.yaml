# Opens PRs for fluxcd-*-image-update branches that don't have one yet.
# Reuses the overlay's agent-env (GH_APP_ID/INSTALLATION_ID/GH_PR_REPO/
# GH_PR_LABELS — all non-secret literals) but takes the private key from the
# dedicated fluxcd-pr-secrets Secret, NOT agent-secrets: this job only needs
# GH_APP_PRIVATE_KEY_B64, so the dashboard/A2A/LiteLLM/Mattermost/API creds
# stay out of its blast radius (infosec review of PR #548). Same
# hermes-policy marker as the StatefulSet so the existing IUA bumps it too.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fluxcd-image-update-prs
spec:
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: fluxcd-image-update-prs
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: fluxcd-pr-bot
              image: docker.io/nousresearch/hermes-agent:v2026.9.24 # {"$imagepolicy": "flux-system:hermes-policy"}
              command:
                - python3
                - /scripts/fluxcd-pr.py
              envFrom:
                - configMapRef:
                    name: agent-env
                - secretRef:
                    name: fluxcd-pr-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 10000
                runAsGroup: 10000
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
                  cpu: 500m
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: fluxcd-pr-script
