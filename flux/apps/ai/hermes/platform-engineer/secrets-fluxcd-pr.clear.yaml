# Least-scope Secret for the fluxcd-image-update-prs CronJob: the job only
# needs the GitHub App private key, never the agent's full agent-secrets
# (dashboard/A2A/LiteLLM/Mattermost/API credentials). Infosec review of
# PR #548. Reuses the existing apps-secrets variable — no new variables.
apiVersion: v1
kind: Secret
metadata:
  name: fluxcd-pr-secrets
  namespace: hermes-platform-engineer
type: Opaque
stringData:
  GH_APP_PRIVATE_KEY_B64: "${AI_HERMES_PLATFORM_ENGINEER_GITHUB_APP_PRIVATE_KEY_B64}"
