apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  labels:
    app: hermes
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: hermes
  replicas: 1
  revisionHistoryLimit: 3
  serviceName: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      automountServiceAccountToken: false
      serviceAccountName: hermes
      securityContext:
        fsGroup: 1000
        # The agent image runs as uid 10000 (groups: 10000 only), but kubelet
        # group-owns the projected SA-token volume as root:fsGroup(1000) mode
        # 0640 (verified in-pod 2026-11-13: token is root:1000 -rw-r-----).
        # Without gid 1000 on the process, /var/run/secrets/.../token is
        # unreadable and kubectl fails since inception. supplementalGroups
        # grants it; fsGroup stays 1000 so PVC/volume group ownership
        # (/opt/data is hermes:1000 2775) is unchanged.
        supplementalGroups: [1000]
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-tools
          image: docker.io/library/alpine:3.24.4 # {"$imagepolicy": "flux-system:alpine-policy"}
          command:
            - /bin/sh
            - /seed/install-tools.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: agent-files
              mountPath: /seed
              readOnly: true
        - name: seed-agent
          image: docker.io/nousresearch/hermes-agent:v2026.9.24 # {"$imagepolicy": "flux-system:hermes-policy"}
          command:
            - /bin/sh
            - /seed/seed.sh
          envFrom:
            - configMapRef:
                name: agent-env
            - secretRef:
                name: agent-secrets
          env:
            - name: HOME
              value: /opt/data
            - name: HERMES_HOME
              value: /opt/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: agent-files
              mountPath: /seed
              readOnly: true
      containers:
        - name: agent
          image: docker.io/nousresearch/hermes-agent:v2026.9.24 # {"$imagepolicy": "flux-system:hermes-policy"}
          args:
            - gateway
            - run
          envFrom:
            - configMapRef:
                name: agent-env
            - secretRef:
                name: agent-secrets
          ports:
            - name: api-server
              containerPort: 8642
              protocol: TCP
            - name: dashboard
              containerPort: 9119
              protocol: TCP
            - name: webhook
              containerPort: 8644
              protocol: TCP
            - name: a2a
              containerPort: 9900
              protocol: TCP
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: 1500m
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: shm
              mountPath: /dev/shm
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: agent-scripts
              mountPath: /opt/data/.local/bin/gh-pr.py
              subPath: gh-pr.py
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
              - configMap:
                  name: kube-root-ca.crt # Talos creates this automatically
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: agent-scripts
          configMap:
            name: agent-scripts
            defaultMode: 0755
        - name: agent-files
          configMap:
            name: agent-files
  volumeClaimTemplates:
    - metadata:
        name: hermes-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 64Gi
        storageClassName: longhorn
