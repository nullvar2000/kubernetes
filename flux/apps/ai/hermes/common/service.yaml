---
apiVersion: v1
kind: Service
metadata:
  name: hermes
spec:
  selector:
    app: hermes
  type: ClusterIP
  ports:
    - name: api-server
      port: 8642
      protocol: TCP
      targetPort: 8642
    - name: hermes-dashboard
      port: 9119
      protocol: TCP
      targetPort: 9119
    - name: webhook
      port: 8644
      protocol: TCP
      targetPort: 8644
    # In-cluster only: consumed by the LiteLLM agent gateway (no HTTPRoute)
    - name: a2a
      port: 9900
      protocol: TCP
      targetPort: 9900
