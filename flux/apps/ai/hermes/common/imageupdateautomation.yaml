---
# Shared image pipeline for ALL hermes agent overlays: one ImageRepository,
# one ImagePolicy, one ImageUpdateAutomation. Every marker under
# ./flux/apps/ai/hermes carries flux-system:hermes-policy, so all agents
# bump together. Replaces hermes-agent-policy and the two per-app automations
# (and the stale fluxcd-camofox note: camofox is gone).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: hermes
  namespace: flux-system
spec:
  image: docker.io/nousresearch/hermes-agent
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: hermes-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: hermes
  policy:
    semver:
      range: ">=v2026.4.30"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: hermes-image-update
  namespace: flux-system
spec:
  interval: 12h
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: '{{range .Changed.Changes}}{{print .OldValue}} -> {{println .NewValue}}{{end}}'
    push:
      branch: fluxcd-hermes-image-update
  update:
    path: ./flux/apps/ai/hermes
