apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base for every hermes agent overlay. Consumed via `resources: [../common]`
# from each overlay; this file is never registered as a Flux app entry itself.
# imageupdateautomation.yaml is NOT listed here: it is flux-system-scoped and
# is registered by ../kustomization.yaml so the overlay namespace transformer
# cannot touch it.

resources:
  - service.yaml
  - httproute.yaml
  - rbac.yaml
  - statefulset.yaml

configMapGenerator:
  # agent-env INTENTIONALLY stays subject to postBuild substitution: its
  # ${GLOBAL_*}/${AI_*} placeholders are the substituteFrom mechanism.
  - name: agent-env
    envs:
      - files/agent.env
  # agent-scripts/agent-files embed shell/python/hermes sources containing
  # literal ${...} (shell parameter expansions, Hermes ${env:VAR}). Flux's
  # postBuild envsub is non-strict (StrictPostBuildSubstitutions gate off):
  # every unrecognized ${...} in the rendered tree is replaced with the
  # EMPTY STRING, silently gutting these files (observed 2026-11-12:
  # fastcrw "Bearer " header, seed.sh GH_APP_* guards, clone URL tokens).
  # Per-resource opt-out via this annotation is kustomize-controller's
  # documented escape. Do not remove.
  - name: agent-scripts
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - files/gh-pr.py
  - name: agent-files
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - files/install-tools.sh
      - files/seed.sh
      - files/gitops-token.py
      - files/git-fetch-origin.sh
      - files/config.yaml.tmpl
