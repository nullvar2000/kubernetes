apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - httproute.yaml
  - imageupdateautomation.yaml
  - secrets.clear.yaml
  - service.yaml
  - statefulset.yaml

configMapGenerator:
  - name: agent-env
    namespace: hermes-infosec
    envs:
      - files/agent.env
  - name: agent-scripts
    namespace: hermes-infosec
    files:
      - files/gh-pr.py
      - files/gh-review.py
  - name: agent-files
    namespace: hermes-infosec
    files:
      - files/install-tools.sh
      - files/seed.sh
      - files/SOUL.md
      - files/config.yaml.tmpl
