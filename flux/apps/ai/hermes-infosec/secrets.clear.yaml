apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: hermes-infosec
type: Opaque
stringData:
  # All values quoted: substituted numeric/empty values would otherwise be
  # re-parsed as YAML ints (Flux postBuild typed-patch failure).
  # LiteLLM model key (dedicated virtual key: per-agent spend + revocation)
  LITELLM_API_KEY: "${AI_HERMES_INFOSEC_LITELLM_API_KEY}"
  # A2A inbound bearer (composed: only the 'litellm' peer identity may call)
  A2A_PEER_TOKENS: "litellm:${AI_HERMES_INFOSEC_A2A_TOKEN}"
  # GitHub App (infosec-engineer's own App)
  GH_APP_ID: "${AI_HERMES_INFOSEC_GH_APP_ID}"
  GH_APP_INSTALLATION_ID: "${AI_HERMES_INFOSEC_GH_APP_INSTALLATION_ID}"
  GH_APP_PRIVATE_KEY_B64: "${AI_HERMES_INFOSEC_GITHUB_APP_PRIVATE_KEY_B64}"
  # StackRox Central read-only API token
  STACKROX_API_TOKEN: "${AI_HERMES_INFOSEC_STACKROX_API_TOKEN}"
