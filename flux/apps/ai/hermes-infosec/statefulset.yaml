apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-infosec
  namespace: hermes-infosec
  labels:
    app: hermes-infosec
    app.kubernetes.io/name: hermes-infosec
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: hermes-infosec
  replicas: 1
  revisionHistoryLimit: 3
  serviceName: hermes-infosec
  template:
    metadata:
      labels:
        app: hermes-infosec
    spec:
      automountServiceAccountToken: false
      serviceAccountName: hermes-infosec
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-sops
          image: docker.io/library/alpine:3.24.4 # {"$imagepolicy": "flux-system:alpine-policy"}
          command:
            - /bin/sh
            - /seed/install-tools.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          volumeMounts:
            - name: hermes-infosec-data
              mountPath: /opt/data
            - name: agent-files
              mountPath: /seed
              readOnly: true
        - name: seed-agent
          image: docker.io/nousresearch/hermes-agent:v2026.9.24 # {"$imagepolicy": "flux-system:hermes-agent-policy"}
          command:
            - /bin/sh
            - /seed/seed.sh
          envFrom:
            - configMapRef:
                name: agent-env
            - secretRef:
                name: agent-secrets
          env:
            - name: HOME
              value: /opt/data
            - name: HERMES_HOME
              value: /opt/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          volumeMounts:
            - name: hermes-infosec-data
              mountPath: /opt/data
            - name: agent-files
              mountPath: /seed
              readOnly: true
      containers:
        - name: agent
          image: docker.io/nousresearch/hermes-agent:v2026.9.24 # {"$imagepolicy": "flux-system:hermes-agent-policy"}
          args:
            - gateway
            - run
          envFrom:
            - configMapRef:
                name: agent-env
            - secretRef:
                name: agent-secrets
          ports:
            - name: api-server
              containerPort: 8642
              protocol: TCP
            - name: webhook
              containerPort: 8644
              protocol: TCP
            - name: a2a
              containerPort: 9900
              protocol: TCP
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: 1500m
          volumeMounts:
            - name: hermes-infosec-data
              mountPath: /opt/data
            - name: shm
              mountPath: /dev/shm
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: agent-scripts
              mountPath: /opt/data/.local/bin/gh-pr.py
              subPath: gh-pr.py
              readOnly: true
            - name: agent-scripts
              mountPath: /opt/data/.local/bin/gh-review.py
              subPath: gh-review.py
              readOnly: true
        - name: code-server
          image: docker.io/linuxserver/code-server:4.145.0 # {"$imagepolicy": "flux-system:code-server-policy"}
          ports:
            - containerPort: 8443
              protocol: TCP
          env:
            - name: PUID
              value: '10000'
            - name: GUID
              value: '10000'
            - name: TZ
              value: ${GLOBAL_TZ}
            - name: DEFAULT_WORKSPACE
              value: /opt/data
          volumeMounts:
            - name: code-server-config
              mountPath: /config
            - name: hermes-infosec-data
              mountPath: /opt/data
          resources:
            requests:
              memory: 128Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 500m
      restartPolicy: Always
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
              - configMap:
                  name: kube-root-ca.crt # Talos creates this automatically
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: agent-scripts
          configMap:
            name: agent-scripts
            defaultMode: 0755
        - name: agent-files
          configMap:
            name: agent-files
  volumeClaimTemplates:
    - metadata:
        name: hermes-infosec-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 64Gi
        storageClassName: longhorn
    - metadata:
        name: code-server-config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 16Gi
        storageClassName: longhorn
