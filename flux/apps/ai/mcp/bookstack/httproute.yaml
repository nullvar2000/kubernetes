apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookstack-mcp
  namespace: mcp
spec:
  parentRefs:
  - name: gateway-api
    namespace: istio-gateway
  hostnames:
  - "mcp-wiki.${GLOBAL_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: bookstack-mcp
      port: 8080
