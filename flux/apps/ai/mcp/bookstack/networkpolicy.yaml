# Ingress to the MCP shim: istio gateway (workstation opencode over HTTPS, the
# /message endpoint itself requires a bearer token) plus the in-cluster agent
# consumers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookstack-mcp-ingress
  namespace: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bookstack-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes-agent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes-infosec
      ports:
        - protocol: TCP
          port: 3000
