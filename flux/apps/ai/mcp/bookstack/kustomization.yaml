apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secrets.clear.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - networkpolicy.yaml

# Hash-suffixed: editing the env file rolls the deployment automatically.
configMapGenerator:
  - name: bookstack-mcp-config
    namespace: mcp
    envs:
      - files/bookstack-mcp.env
