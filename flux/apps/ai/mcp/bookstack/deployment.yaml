apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstack-mcp
  namespace: mcp
  labels:
    app.kubernetes.io/name: bookstack-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: bookstack-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookstack-mcp
    spec:
      securityContext:
        # Image runs as the non-root "bun" user; pinned numerically because
        # kubelet cannot verify a non-numeric image USER against runAsNonRoot.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bookstack-mcp
          image: ghcr.io/nullvar2000/bookstack-mcp-server:v2.1.1@sha256:55716780926915a34331105f49c44a3f283fa996b423b777547d8eba9efefabf
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bookstack-mcp-config
            - secretRef:
                name: bookstack-mcp
          # /health returns 503 while the BookStack token is invalid/unreachable,
          # so gate readiness on it but keep liveness on the always-200 "/"
          # (avoids a restart loop from a misconfigured token).
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
