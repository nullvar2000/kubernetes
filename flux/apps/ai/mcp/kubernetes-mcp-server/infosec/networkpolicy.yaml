# Restrict MCP endpoint ingress to LiteLLM (the only client). Declarative on
# flannel today; becomes effective with a policy-enforcing CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-infosec-ingress
  namespace: kubernetes-mcp-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp-server
      app.kubernetes.io/component: infosec
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
      ports:
        - protocol: TCP
          port: 8080
