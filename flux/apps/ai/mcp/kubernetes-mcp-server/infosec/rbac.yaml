# Mirrors the infosec-engineer agent's own permissions: bound to the SAME
# ClusterRole defined in flux/apps/ai/hermes-infosec/rbac.yaml. Edit it there;
# both consumers follow.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-infosec
  namespace: kubernetes-mcp-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-infosec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-infosec-read
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-infosec
    namespace: kubernetes-mcp-server
