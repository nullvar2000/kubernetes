apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-ops
  namespace: kubernetes-mcp-server
---
# Bounded transient writes only. No create on arbitrary kinds (pods_run and
# arbitrary SSA writes stay blocked), no Secrets, no RBAC/Namespace/Longhorn
# mutation. Flux remains the only writer of desired app state.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-mcp-ops-writes
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale", "daemonsets/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-ops
    namespace: kubernetes-mcp-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-ops-writes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-mcp-ops-writes
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-ops
    namespace: kubernetes-mcp-server
---
# Same read extras as the view profile (nodes, metrics)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-ops-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-mcp-view-extra
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-ops
    namespace: kubernetes-mcp-server
