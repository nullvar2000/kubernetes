# Restrict MCP endpoint ingress: ops endpoint takes exec/delete-capable RBAC and
# the server itself has no auth, so only LiteLLM (the only client) may reach it.
# Fixes the High finding on PR #486.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-ops-ingress
  namespace: kubernetes-mcp-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp-server
      app.kubernetes.io/component: ops
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
      ports:
        - protocol: TCP
          port: 8080
