# Read-only view endpoint: still cluster-metadata disclosure to any pod, so
# scope ingress to LiteLLM as well (paired with ops/networkpolicy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-view-ingress
  namespace: kubernetes-mcp-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp-server
      app.kubernetes.io/component: view
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
      ports:
        - protocol: TCP
          port: 8080
