apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-view
  namespace: kubernetes-mcp-server
---
# view is missing nodes, nodes/proxy, nodes/log and metrics.k8s.io; add only
# the read rules the diagnostic tools (nodes_top, nodes_log, pods_top) need.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-mcp-view-extra
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy", "nodes/log"]
    verbs: ["get", "create"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-view
    namespace: kubernetes-mcp-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-view-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-mcp-view-extra
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-view
    namespace: kubernetes-mcp-server
