apiVersion: v1
kind: Secret
metadata:
  name: litellm
  namespace: litellm
type: Opaque
stringData:
  DATABASE_URL: postgres://${AI_LITELLM_POSTGRES_USER}:${AI_LITELLM_POSTGRES_PASSWORD}@postgres:5432/${AI_LITELLM_POSTGRES_DB}
  LLAMA_SERVER_API_KEY: ${AI_LITELLM_LLAMA_SERVER_API_KEY}
  LITELLM_MASTER_KEY: ${AI_LITELLM_MASTER_KEY}
  LITELLM_SALT_KEY: ${AI_LITELLM_SALT_KEY}
  SEARXNG_MCP_HTTP_AUTH_TOKEN: ${SEARXNG_MCP_HTTP_AUTH_TOKEN}
  GENERIC_CLIENT_ID: ${AI_LITELLM_OIDC_CLIENT_ID}
  GENERIC_CLIENT_SECRET: ${AI_LITELLM_OIDC_CLIENT_SECRET}
  GENERIC_AUTHORIZATION_ENDPOINT: https://keycloak.${GLOBAL_DOMAIN}/realms/${GLOBAL_KEYCLOAK_REALM}/protocol/openid-connect/auth
  GENERIC_TOKEN_ENDPOINT: https://keycloak.${GLOBAL_DOMAIN}/realms/${GLOBAL_KEYCLOAK_REALM}/protocol/openid-connect/token
  GENERIC_USERINFO_ENDPOINT: https://keycloak.${GLOBAL_DOMAIN}/realms/${GLOBAL_KEYCLOAK_REALM}/protocol/openid-connect/userinfo
  GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: name
  GENERIC_USER_FIRST_NAME_ATTRIBUTE: given_name
  GENERIC_USER_LAST_NAME_ATTRIBUTE: family_name
  PROXY_BASE_URL: https://litellm.${GLOBAL_DOMAIN}
  PROXY_ADMIN_ID: ${AI_LITELLM_OIDC_PROXY_ADMIN_ID}
