apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app: litellm
spec:
  selector:
    matchLabels:
      app: litellm
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.101.0 # {"$imagepolicy": "flux-system:litellm-policy"}
          args:
            - --config
            - /app/config.yaml
          envFrom:
            - secretRef:
                name: litellm
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          volumeMounts:
            - name: litellm-config-yaml
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: '2'
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 120
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 120
            periodSeconds: 15
      restartPolicy: Always
      volumes:
        - name: litellm-config-yaml
          configMap:
            name: litellm-config-yaml
