apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres/secrets.clear.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - postgres/imageupdateautomation.yaml
  - secrets.clear.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - imageupdateautomation.yaml

configMapGenerator:
  - name: litellm-config-yaml
    namespace: litellm
    files:
      - files/config.yaml
