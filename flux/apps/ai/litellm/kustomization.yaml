apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres/imageupdateautomation.yaml
  - postgres/service.yaml
  - postgres/statefulset.yaml
  - git-repo.yaml
  - helm-chart.yaml
  - helm-release.yaml
  - namespace.yaml
  - secrets.clear.yaml

configMapGenerator:
  - name: helm-values
    files:
      - files/values.yaml
    options:
      disableNameSuffixHash: true
