apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres/secrets.clear.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - postgres/imageupdateautomation.yaml
  - litellm/secrets.clear.yaml
  - litellm/deployment.yaml
  - litellm/service.yaml
  - litellm/httproute.yaml
  - litellm/imageupdateautomation.yaml

configMapGenerator:
  - name: litellm-config-yaml
    namespace: litellm
    files:
      - litellm/files/config.yaml
