apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crw
  namespace: fastcrw
spec:
  parentRefs:
  - name: gateway-api
    namespace: istio-gateway
  hostnames:
    - crw.${GLOBAL_DOMAIN}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: crw
      port: 3000
