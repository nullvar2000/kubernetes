apiVersion: apps/v1
kind: Deployment
metadata:
  name: crw
  namespace: fastcrw
  labels:
    app: crw
spec:
  selector:
    matchLabels:
      app: crw
  replicas: 1
  template:
    metadata:
      labels:
        app: crw
    spec:
      containers:
        - name: crw
          image: ghcr.io/fastcrw/crw:0.37.2 # {"$imagepolicy": "flux-system:crw-policy"}
          env:
            - name: RUST_LOG
              value: "info"
            - name: CRW_CONFIG
              value: "config.docker"
            - name: CRW_EXTRACTION__LLM__API_KEY
              valueFrom:
                secretKeyRef:
                  name: crw
                  key: LITELLM_API_KEY
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests:
              cpu: 100m
              memory: 32M
            limits:
              cpu: 1000m
              memory: 2G
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: crw-config-toml
              mountPath: /app/config.docker.toml
              subPath: config.toml
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: crw-config-toml
          configMap:
            name: crw-config-toml
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
