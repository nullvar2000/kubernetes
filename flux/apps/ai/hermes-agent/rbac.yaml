---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
  namespace: hermes-agent
---
# Read-only cluster access for in-pod kubectl verification (Flux sync state,
# pods, events) and reading the sops-age secret in flux-system for in-cluster
# sops encryption. Same pattern as mordin-read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-agent-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: hermes-agent
    namespace: hermes-agent
