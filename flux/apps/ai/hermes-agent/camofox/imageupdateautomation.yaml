---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: camofox
  namespace: flux-system
spec:
  image: ghcr.io/jo-inc/camofox-browser
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: camofox-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: camofox
  policy:
    semver:
      range: ">=1.11.2"
# camofox has no ImageUpdateAutomation of its own: the camofox container is a sidecar in
# ../statefulset.yaml, whose marker ../imageupdateautomation.yaml's hermes-agent-image-update
# already rewrites (an automation updates every marker under its path). Its own automation
# pushed duplicate branches (fluxcd-camofox-image-update == fluxcd-hermes-agent-image-update).
# The ImageRepository and ImagePolicy above must stay so the marker still resolves.
