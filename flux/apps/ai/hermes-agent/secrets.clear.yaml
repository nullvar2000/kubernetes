apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: hermes-agent
type: Opaque
stringData:
  # Only real credentials here — values must never be numeric-looking, because
  # envsubst-substituted values are re-parsed as YAML and bare numbers become
  # ints (typed-patch failure). The public GH App/Installation IDs are
  # literals in files/agent.env instead.
  # Dashboard basic auth (the username stays in files/agent.env)
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${AI_HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}"
  # A2A inbound bearer (composed: only the 'litellm' peer identity may call)
  A2A_PEER_TOKENS: "litellm:${AI_HERMES_A2A_TOKEN}"
  # GitHub App private key
  GH_APP_PRIVATE_KEY_B64: "${AI_HERMES_GITHUB_APP_PRIVATE_KEY_B64}"
  # LiteLLM model key (dedicated virtual key: per-agent spend + revocation)
  LITELLM_API_KEY: "${AI_HERMES_LITELLM_API_KEY}"
