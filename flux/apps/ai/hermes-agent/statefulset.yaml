apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-agent
  namespace: hermes-agent
  labels:
    app: hermes-agent
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: hermes-agent
  replicas: 1
  revisionHistoryLimit: 3
  serviceName: agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      automountServiceAccountToken: false
      serviceAccountName: hermes-agent
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-sops
          image: docker.io/library/alpine:3.24.4 # {"$imagepolicy": "flux-system:alpine-policy"}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              BIN=/opt/data/.local/bin
              mkdir -p "$BIN"
              # NB sops --version prints "sops 3.13.3 (latest)" — no leading "v".
              # Temp file + mv: an existing sops on the PVC may be owned by the
              # agent user (uid 10000) and this container drops all capabilities
              # (no CAP_FOWNER), so chmod on that file fails with EPERM.
              if [ -x "$BIN/sops" ] && "$BIN/sops" --version 2>/dev/null | grep -q '^sops 3\.13\.3'; then
                echo "sops 3.13.3 already installed"
              else
                apk add --no-cache curl >/dev/null
                curl -fsSL -o "$BIN/sops.new" https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
                chmod 755 "$BIN/sops.new"
                mv -f "$BIN/sops.new" "$BIN/sops"
                echo "installed $( "$BIN/sops" --version 2>/dev/null | head -1 )"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: hermes-agent-data
              mountPath: /opt/data
        - name: camofox
          image: ghcr.io/jo-inc/camofox-browser:1.18.1 # {"$imagepolicy": "flux-system:camofox-policy"}
          envFrom:
            - configMapRef:
                name: camofox-config
          ports:
            - name: http
              containerPort: 9377
              protocol: TCP
            - name: novnc
              containerPort: 6080
              protocol: TCP
          resources:
            requests:
              memory: 128Mi
              cpu: 250m
            limits:
              memory: 2Gi
            cpu: 500m
          restartPolicy: Always
      containers:
        - name: agent
          image: docker.io/nousresearch/hermes-agent:v2026.9.24 # {"$imagepolicy": "flux-system:hermes-agent-policy"}
          args:
            - gateway
            - run
          envFrom:
            - configMapRef:
                name: agent-env
          ports:
            - name: api-server
              containerPort: 8642
              protocol: TCP
            - name: dashboard
              containerPort: 9119
              protocol: TCP
            - name: webhook
              containerPort: 8644
              protocol: TCP
            - name: a2a
              containerPort: 9900
              protocol: TCP
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: 1500m
          volumeMounts:
            - name: hermes-agent-data
              mountPath: /opt/data
            - name: shm
              mountPath: /dev/shm
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: agent-scripts
              mountPath: /opt/data/.local/bin/gh-pr.py
              subPath: gh-pr.py
              readOnly: true
        - name: code-server
          image: docker.io/linuxserver/code-server:4.145.0 # {"$imagepolicy": "flux-system:code-server-policy"}
          ports:
            - containerPort: 8443
              protocol: TCP
          env:
            - name: PUID
              value: '10000'
            - name: GUID
              value: '10000'
            - name: TZ
              value: ${GLOBAL_TZ}
            - name: DEFAULT_WORKSPACE
              value: /opt/data
          volumeMounts:
            - name: code-server-config
              mountPath: /config
            - name: hermes-agent-data
              mountPath: /opt/data
          resources:
            requests:
              memory: 128Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 500m
      restartPolicy: Always
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
              - configMap:
                  name: kube-root-ca.crt # Talos creates this automatically                                                                                                 
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: agent-scripts
          configMap:
            name: agent-scripts
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: hermes-agent-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 64Gi
        storageClassName: longhorn
    - metadata:
        name: code-server-config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 16Gi
        storageClassName: longhorn
