apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - httproute.yaml
  - imageupdateautomation.yaml
  - namespace.yaml
  - secrets.clear.yaml
  - service.yaml

configMapGenerator:
  - name: searxng-settings
    namespace: searxng
    files:
      - files/settings.yml
  - name: mcp-config
    namespace: searxng
    envs:
      - files/mcp-config.env
