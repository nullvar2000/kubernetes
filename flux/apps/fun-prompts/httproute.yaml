apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fun-prompts
  namespace: fun-prompts
spec:
  parentRefs:
  - name: gateway-api
    namespace: istio-gateway
  hostnames:
    - fun-prompts.${GLOBAL_DOMAIN}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: fun-prompts
      port: 80
