apiVersion: v1
kind: Service
metadata:
  name: echomuse-controller
  namespace: homeassistant
spec:
  selector:
    app: echomuse-controller
  type: LoadBalancer
  ports:
    - name: ws
      port: 8767
      protocol: TCP
      targetPort: 8767
    - name: ws-tls
      port: 8770
      protocol: TCP
      targetPort: 8770
    - name: echomuse-controller
      port: 8768
      protocol: TCP
      targetPort: 8768
    - name: emos-01
      port: 16001
      protocol: TCP
      targetPort: 16001
    - name: emos-02
      port: 16002
      protocol: TCP
      targetPort: 16002
    - name: emos-03
      port: 16003
      protocol: TCP
      targetPort: 16003
    - name: emos-01-bt-proxy
      port: 17001
      protocol: TCP
      targetPort: 17001
    - name: emos-02-bt-proxy
      port: 17002
      protocol: TCP
      targetPort: 17002
    - name: emos-03-bt-proxy
      port: 17003
      protocol: TCP
      targetPort: 17003