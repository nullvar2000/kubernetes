apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: echomuse-controller
  namespace: homeassistant
  labels:
    app: echomuse-controller
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: echomuse-controller
  serviceName: echomuse-controller
  template:
    metadata:
      labels:
        app: echomuse-controller
    spec:
      containers:
      - name: echomuse-controller
        image: ghcr.io/wilbowes/echomuse-controller:2.25.0 # {"$imagepolicy": "flux-system:echomuse-controller-policy"}
        envFrom:
          - configMapRef:
              name: echomuse-controller-env
        volumeMounts:
        - mountPath: /app/data
          name: echomuse-controller-data
        resources:
          requests:
            cpu: 100m
            memory: 128M
          limits:
            cpu: 1000m
            memory: 512M
      volumes:
      - name: echomuse-controller-data
        persistentVolumeClaim:
          claimName: echomuse-controller-data
