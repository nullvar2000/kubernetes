---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: echomuse-controller
  namespace: flux-system
spec:
  image: ghcr.io/wilbowes/echomuse-controller
  interval: 24h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: echomuse-controller-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: echomuse-controller
  policy:
    semver:
      range: ">=2.24.1"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: echomuse-controller-image-update
  namespace: flux-system
spec:
  interval: 6h
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: '{{range .Changed.Changes}}{{print .OldValue}} -> {{println .NewValue}}{{end}}'
    push:
      branch: fluxcd-echomuse-controller-image-update
  update:
    path: ./flux/apps/smart-home/echomuse-controller
