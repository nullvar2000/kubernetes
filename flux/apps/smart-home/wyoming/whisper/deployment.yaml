apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-whisper
  namespace: homeassistant
  labels:
    app: whisper
spec:
  selector:
    matchLabels:
      app: whisper
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    metadata:
      labels:
        app: whisper
    spec:
      containers:
      - name: wyoming-whisper
        image: docker.io/rhasspy/wyoming-whisper:3.8.1 # {"$imagepolicy": "flux-system:whisper-policy"}
        args: ["--model", "small.en", "--language", "en", "--compute-type", "int8"]
        ports:
        - containerPort: 10300
        volumeMounts:
        - mountPath: /data
          name: data
        resources:
          requests:
            cpu: 1000m
            memory: 1Gi
          limits:
            cpu: 4000m
            memory: 4Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: whisper-data
