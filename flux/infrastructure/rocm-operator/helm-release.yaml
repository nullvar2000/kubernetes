apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rocm-operator
  namespace: rocm-operator
spec:
  interval: 1h
  releaseName: rocm-operator
  chart:
    spec:
      chart: rocm-operator
      version: 'v1.5.*'
      sourceRef:
        kind: HelmRepository
        name: rocm-operator
  values:
    prometheus:
      enable: true
