apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
  namespace: rustfs
spec:
  interval: 30m
  releaseName: rustfs
  chartRef:
    kind: HelmChart
    name: rustfs
    namespace: flux-system
  values:
    mode:
      standalone:
        enabled: true
      distributed:
        enabled: false
    secret:
      existingSecret: rustfs
    ingress:
      enabled: false
    config:
      rustfs:
        obs_environment: production
        log_rotation:
          size: 100 # MB per rotated log file
          time: day
          keep_files: 5
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 4Gi
    storageclass:
      name: longhorn
      dataStorageSize: 16Gi
      logStorageSize: 2Gi
