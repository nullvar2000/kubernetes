apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
  namespace: rustfs
spec:
  interval: 30m
  releaseName: rustfs
  chartRef:
    kind: HelmChart
    name: rustfs
    namespace: flux-system
  values:
    # Upstream's in-repo chart is still chart 1.0.4 (appVersion 1.0.4) at git tags
    # 1.0.6 and 1.0.7, so its appVersion-based default image tag lags the release.
    # Pin the app image explicitly so the git-tag bump lands on the matching
    # stable release image.
    image:
      rustfs:
        tag: "1.0.7"
    mode:
      standalone:
        enabled: true
      distributed:
        enabled: false
    secret:
      existingSecret: rustfs
    ingress:
      enabled: false
    config:
      rustfs:
        obs_environment: production
        log_rotation:
          size: 100 # MB per rotated log file
          time: day
          keep_files: 5
    podAnnotations:
      config-revision: "2026-10-06-log-rotation"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 4Gi
    storageclass:
      name: longhorn
      dataStorageSize: 16Gi
      logStorageSize: 2Gi
