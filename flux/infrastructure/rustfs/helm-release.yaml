apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
  namespace: rustfs
spec:
  interval: 30m
  releaseName: rustfs
  chartRef:
    kind: HelmChart
    name: rustfs
    namespace: flux-system
  values:
    # Upstream's in-repo chart at git tag 1.0.6 is chart 1.0.4 and its appVersion
    # (the default image tag) lags at 1.0.4. Pin the app image explicitly so the
    # git-tag bump lands on the 1.0.6 stable release image.
    image:
      rustfs:
        tag: "1.0.6"
    mode:
      standalone:
        enabled: true
      distributed:
        enabled: false
    secret:
      existingSecret: rustfs
    ingress:
      enabled: false
    config:
      rustfs:
        obs_environment: production
        log_rotation:
          size: 100 # MB per rotated log file
          time: day
          keep_files: 5
    podAnnotations:
      config-revision: "2026-10-06-log-rotation"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 4Gi
    storageclass:
      name: longhorn
      dataStorageSize: 16Gi
      logStorageSize: 2Gi
