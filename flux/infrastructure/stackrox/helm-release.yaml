apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stackrox-operator
  namespace: stackrox-operator-system
spec:
  interval: 1h
  timeout: 15m
  releaseName: stackrox-operator
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    remediation:
      retries: 3
    crds: CreateReplace
  chart:
    spec:
      chart: stackrox-operator
      version: 4.11.7
      sourceRef:
        kind: HelmRepository
        name: stackrox
