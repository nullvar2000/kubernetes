apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: stackrox-secured-cluster-services
  namespace: stackrox
spec:
  clusterName: kingperch
  centralEndpoint: central.stackrox.svc:443
  # Field names verified against the live 4.11.6 CRD:
  # - no spec.initBundle (the init-bundle secrets are applied imperatively once)
  # - collector config lives under perNode, network policies under network.policies
  # - no admissionControl.clusterAdmissionPolicy (enforcement stays at its
  #   Enabled default; with no build-time policies configured nothing blocks,
  #   i.e. observe/scan-only)
  admissionControl:
    listenOnCreates: true
    listenOnUpdates: true
    listenOnEvents: true
    contactImageScanners: ScanIfMissing
    timeoutSeconds: 4
  perNode:
    collector:
      collection: CORE_BPF
  # StackRox 4.11 collector binaries are built for x86-64-v3 (AVX2/BMI);
  # talos-cp01-03, s02, s03 lack these CPU features and the collector
  # crash-loops there ("Fatal glibc error: CPU does not support x86-64-v3").
  # Keep the DaemonSet on the capable nodes; all other 4.11 workloads land
  # on capable nodes through normal scheduling anyway.
  overlays:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: collector
      patches:
        - path: spec.template.spec.affinity
          value: |
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - talos-cp01
                          - talos-cp02
                          - talos-cp03
                          - talos-s02
                          - talos-s03
  network:
    policies: Enabled
