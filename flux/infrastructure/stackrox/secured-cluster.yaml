apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: stackrox-secured-cluster-services
  namespace: stackrox
spec:
  clusterName: kingperch
  centralEndpoint: central.stackrox.svc:443
  # Field names verified against the live 4.11.6 CRD:
  # - no spec.initBundle (the init-bundle secrets are applied imperatively once)
  # - collector config lives under perNode, network policies under network.policies
  # - no admissionControl.clusterAdmissionPolicy (enforcement stays at its
  #   Enabled default; with no build-time policies configured nothing blocks,
  #   i.e. observe/scan-only)
  admissionControl:
    listenOnCreates: true
    listenOnUpdates: true
    listenOnEvents: true
    contactImageScanners: ScanIfMissing
    timeoutSeconds: 4
  perNode:
    collector:
      collection: CORE_BPF
  network:
    policies: Enabled
