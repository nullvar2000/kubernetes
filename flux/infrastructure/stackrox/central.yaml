apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
  namespace: stackrox
spec:
  central:
    # Serve the cert-manager LE cert (cert.yaml) on 443 so the gateway can
    # re-encrypt with BackendTLSPolicy (wellKnownCACertificates: System).
    # Field names verified against the live 4.11.6 CRD: there is no
    # adminGenerationEnabled (admin password generation is on by default).
    defaultTLSSecret:
      name: stackrox-tls
    exposure:
      loadBalancer:
        enabled: false
      nodePort:
        enabled: false
      route:
        enabled: false
    persistence:
      persistentVolumeClaim:
        claimName: stackrox-db
        size: 10Gi
        storageClassName: longhorn
    db:
      persistence:
        persistentVolumeClaim:
          claimName: central-db
          size: 10Gi
          storageClassName: longhorn
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 1
          memory: 2Gi
    resources:
      requests:
        cpu: 500m
        memory: 3Gi
      limits:
        cpu: 2
        memory: 4Gi
    telemetry:
      enabled: false
  scannerV4:
    scannerComponent: Enabled
    db:
      persistence:
        persistentVolumeClaim:
          claimName: scanner-v4-db
          size: 15Gi
          storageClassName: longhorn
    indexer:
      scaling:
        autoScaling: Disabled
        replicas: 1
        minReplicas: 1
        maxReplicas: 2
    matcher:
      scaling:
        autoScaling: Disabled
        replicas: 1
        minReplicas: 1
        maxReplicas: 2
  egress:
    connectivityPolicy: Online
  # 4.11 ships legacy Clair-based Scanner v1 as Enabled by default; V4 above
  # covers all scanning on non-OpenShift, and v1 would add a scanner-db PVC
  # on the default (nfs-client) class.
  scanner:
    scannerComponent: Disabled
