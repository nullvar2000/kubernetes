apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stackrox
  namespace: stackrox
spec:
  parentRefs:
    - name: gateway-api
      namespace: istio-gateway
  hostnames:
    - stackrox.${GLOBAL_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: central
          port: 443
