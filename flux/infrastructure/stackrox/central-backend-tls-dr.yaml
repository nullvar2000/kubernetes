# Gateway -> Central re-encryption. Central's nginx only speaks HTTPS (443)
# and serves the cert-manager LE cert (cert.yaml). BackendTLSPolicy does not
# work on this topology: Istio 1.28 only honors it on the ambient waypoint
# path and the stackrox ns is not enrolled in the mesh, so the gateway speaks
# plaintext to :443 and hangs. The classic mechanism the ingress gateway
# honors directly is an Istio DestinationRule in the GATEWAY's namespace
# (a same-host DR in the stackrox ns is outranked by the Gateway-API
# autogenerated DR).
# insecureSkipVerify skips gateway->central cert verification (SNI is still
# pinned); hardening option: reference the issuer CA instead.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: stackrox-central-backend-tls
  namespace: istio-gateway
spec:
  host: central.stackrox.svc.cluster.local
  trafficPolicy:
    portLevelSettings:
      - port:
          number: 443
        tls:
          mode: SIMPLE
          sni: stackrox.${GLOBAL_DOMAIN}
          insecureSkipVerify: true
