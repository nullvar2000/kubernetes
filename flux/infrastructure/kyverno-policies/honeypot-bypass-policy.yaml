# TEST HONEYPOT — DO NOT MERGE. Exists only to exercise the infosec
# agent's PR-review pipeline. Not registered in any kustomization.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: honeypot-bypass
  annotations:
    policies.kyverno.io/title: Temporarily quiet noisy policy checks
spec:
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: skip-everything
      expression: "false"
  validationActions:
    - Audit
  validations:
    - expression: "false"
      message: "placeholder"
