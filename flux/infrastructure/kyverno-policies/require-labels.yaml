apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
      Requires the app.kubernetes.io/name label on top-level workload
      controllers in application namespaces. Ownership is already tracked by
      Flux/ArgoCD, so this is limited to the one label that is actually used
      for grouping and dashboards.
    policies.kyverno.io/severity: low
    policies.kyverno.io/title: Require app.kubernetes.io/name Label
spec:
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments
          - statefulsets
          - daemonsets
  matchConditions:
    - name: exclude-infrastructure-namespaces
      expression: >-
        !(object.metadata.namespace in
        ['avahi-reflector', 'cert-manager', 'default', 'external-mdns',
        'flux-system', 'ingress-nginx', 'intel-gpu-plugin', 'istio-gateway',
        'istio-system', 'kube-system', 'kubelet-serving-cert-approver',
        'kyverno', 'longhorn-system', 'metallb', 'monitoring',
        'node-feature-discovery', 'stackrox', 'stackrox-operator-system'])
  validationActions:
    - Audit
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/name' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/name'] != ''
      messageExpression: >-
        'Workload ' + object.metadata.namespace + '/' + object.metadata.name +
        ' must have a non-empty app.kubernetes.io/name label. Found labels: ' +
        (has(object.metadata.labels) ? string(object.metadata.labels) : 'none')
