[server]
use-ipv4=yes
use-ipv6=no
# eno0 = LAN, cni0 = flannel bridge where pod mDNS arrives (no inline comments on value lines)
allow-interfaces=eno0,cni0
# disabled because the container doesn't run a system dbus daemon
enable-dbus=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=yes

[publish]
publish-hinfo=no
publish-workstation=no
publish-domain=no

[reflector]
# bridges the mDNS traffic across interfaces/namespaces
enable-reflector=yes
