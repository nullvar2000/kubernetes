[server]
use-ipv4=yes
use-ipv6=no
allow-interfaces=eno0,cni0  # eno0 = LAN, cni0 = flannel bridge where pod mDNS arrives
enable-dbus=no        # Disabled because the container doesn't run a system dbus daemon
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=yes

[publish]
publish-hinfo=no
publish-workstation=no
publish-domain=no

[reflector]
enable-reflector=yes  # This bridges the mDNS traffic across interfaces/namespaces
