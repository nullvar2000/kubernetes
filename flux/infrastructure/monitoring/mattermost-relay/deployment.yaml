apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost-relay
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mattermost-relay
    app.kubernetes.io/instance: mattermost-relay
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/part-of: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mattermost-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mattermost-relay
        app.kubernetes.io/instance: mattermost-relay
        app.kubernetes.io/managed-by: flux
        app.kubernetes.io/part-of: monitoring
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: docker.io/library/python:3.12-slim
          command: ["python", "/app/relay.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MATTERMOST_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: mattermost-relay
                  key: webhook-url
            - name: RELAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mattermost-relay
                  key: relay-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: mattermost-relay-script
