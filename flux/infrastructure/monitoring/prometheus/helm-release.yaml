apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  timeout: 15m
  releaseName: kube-prometheus-stack
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '88.1.*'
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
  valuesFrom:
    - kind: ConfigMap
      name: helm-values
