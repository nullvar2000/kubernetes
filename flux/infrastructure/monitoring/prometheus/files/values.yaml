crds:
  enabled: true
  upgradeJob:
    enabled: false

alertmanager:
  enabled: true
  route:
    main:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      hostnames:
        - alertmanager.${GLOBAL_DOMAIN}
      parentRefs:
        - name: gateway-api
          namespace: istio-gateway
      httpsRedirect: false
      matches:
        - path:
            type: PathPrefix
            value: /
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
    time_intervals:
      - name: quiet-hours
        # 23:00-07:00 America/New_York; Alertmanager time windows are UTC-only.
        # UTC 03:00-12:00 covers both EDT (local 23:00-08:00) and EST
        # (local 22:00-07:00), so local 23:00-07:00 is always quiet.
        time_intervals:
          - times:
              - start_time: "03:00"
                end_time: "12:00"
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        # Canary alert: never notify
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        # Info severity: never notify
        - receiver: 'null'
          matchers:
            - severity = "info"
        # Kube{Proxy,Scheduler,ControllerManager}Down fire via the chart's
        # absent(up{job=...}) rules whenever the corresponding ServiceMonitor
        # has zero targets (disabled on this Talos cluster — see the
        # serviceMonitor blocks below). Not actionable; keep them out of the
        # notification path.
        - receiver: 'null'
          matchers:
            - alertname =~ "KubeProxyDown|KubeSchedulerDown|KubeControllerManagerDown"
        # Warning: notify, but muted during quiet hours (UTC 03:00-12:00 /
        # 23:00-07:00 Eastern). In AM >= 0.31 route time intervals gate
        # notification, not route matching, so warnings and criticals need
        # separate routes.
        - receiver: 'mattermost'
          mute_time_intervals:
            - quiet-hours
          matchers:
            - severity = "warning"
        # Critical: always notify (including quiet hours)
        - receiver: 'mattermost'
          matchers:
            - severity = "critical"
    receivers:
      - name: 'null'
      - name: 'mattermost'
        webhook_configs:
          - url: 'http://mattermost-relay.monitoring.svc.cluster.local:8080/'
            send_resolved: true
            http_config:
              bearer_token: ${MONITORING_PROMETHEUS_RELAY_TOKEN}

grafana:
  enabled: true
  adminUser: admin
  adminPassword: ${MONITORING_PROMETHEUS_GRAFANA_ADMIN_PASSWORD}

prometheus:
  enabled: true
  route:
    main:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      hostnames: 
        - prometheus.${GLOBAL_DOMAIN}
      parentRefs:
        - name: gateway-api
          namespace: istio-gateway
      httpsRedirect: false
      matches:
        - path:
            type: PathPrefix
            value: /

# Talos binds kube-proxy (10249), kube-scheduler (10259) and
# kube-controller-manager (10257) metrics to 127.0.0.1, so the chart's
# ServiceMonitors for these three can never scrape on this cluster (permanent
# TargetDown + Kube{Proxy,Scheduler,ControllerManager}InstanceUnreachable,
# 2026-10-06 alert audit). Disable them to stop the noise. To re-enable: first
# expose the endpoints in the Talos machine config (proxy:
# --metrics-bind-address=0.0.0.0:10249 on all nodes; scheduler and
# controller-manager: --bind-address=0.0.0.0 on the control-plane nodes, then
# talosctl upgrade-k8s --version <same version> or reboot per node), then flip
# these back to true.
kubeProxy:
  serviceMonitor:
    enabled: false
kubeScheduler:
  serviceMonitor:
    enabled: false
kubeControllerManager:
  serviceMonitor:
    enabled: false

# Talos runs etcd as a machined service (not a pod), so the chart's default
# headless service (selector component=etcd) has no endpoints and the kube-etcd
# ServiceMonitor scrapes nothing. This cluster's etcd metrics are exposed via a
# manual Talos machine-config patch on each control-plane node
# (talosctl patch machineconfig: cluster.etcd.extraArgs.listen-metrics-urls:
# http://0.0.0.0:2381, then talosctl restart etcd); the chart's static
# endpoints below point the monitor at those nodes (metrics-only endpoint,
# port 2381). If a control-plane node IP changes, update this list.
kubeEtcd:
  endpoints:
    - 192.168.30.101
    - 192.168.30.102
    - 192.168.30.103
