crds:
  enabled: true
  upgradeJob:
    enabled: false

alertmanager:
  enabled: true
  route:
    main:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      hostnames:
        - alertmanager.${GLOBAL_DOMAIN}
      parentRefs:
        - name: gateway-api
          namespace: istio-gateway
      httpsRedirect: false
      matches:
        - path:
            type: PathPrefix
            value: /
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
    time_intervals:
      - name: quiet-hours
        # 23:00-07:00 America/New_York; Alertmanager time windows are UTC-only.
        # UTC 03:00-12:00 covers both EDT (local 23:00-08:00) and EST
        # (local 22:00-07:00), so local 23:00-07:00 is always quiet.
        time_intervals:
          - times:
              - start_time: "03:00"
                end_time: "12:00"
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        # Canary alert: never notify
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        # Info severity: never notify
        - receiver: 'null'
          matchers:
            - severity = "info"
        # Warning: notify, but muted during quiet hours (UTC 03:00-12:00 /
        # 23:00-07:00 Eastern). In AM >= 0.31 route time intervals gate
        # notification, not route matching, so warnings and criticals need
        # separate routes.
        - receiver: 'mattermost'
          mute_time_intervals:
            - quiet-hours
          matchers:
            - severity = "warning"
        # Critical: always notify (including quiet hours)
        - receiver: 'mattermost'
          matchers:
            - severity = "critical"
    receivers:
      - name: 'null'
      - name: 'mattermost'
        webhook_configs:
          - url: 'http://mattermost-relay.monitoring.svc.cluster.local:8080/'
            send_resolved: true
            http_config:
              bearer_token: ${MONITORING_PROMETHEUS_RELAY_TOKEN}

grafana:
  enabled: true
  adminUser: admin
  adminPassword: ${MONITORING_PROMETHEUS_GRAFANA_ADMIN_PASSWORD}

prometheus:
  enabled: true
  route:
    main:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      hostnames: 
        - prometheus.${GLOBAL_DOMAIN}
      parentRefs:
        - name: gateway-api
          namespace: istio-gateway
      httpsRedirect: false
      matches:
        - path:
            type: PathPrefix
            value: /
