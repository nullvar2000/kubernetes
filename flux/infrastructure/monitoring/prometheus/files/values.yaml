crds:
  enabled: true
  upgradeJob:
    enabled: false

alertmanager:
  enabled: true
  route:
    main:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      hostnames:
        - alertmanager.${GLOBAL_DOMAIN}
      parentRefs:
        - name: gateway-api
          namespace: istio-gateway
      httpsRedirect: false
      matches:
        - path:
            type: PathPrefix
            value: /
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
    time_intervals:
      - name: quiet-hours
        # 23:00-07:00 America/New_York; Alertmanager time windows are UTC-only.
        # UTC 03:00-12:00 covers both EDT (local 23:00-08:00) and EST
        # (local 22:00-07:00), so local 23:00-07:00 is always quiet.
        time_intervals:
          - start_hour: 3
            end_hour: 12
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        # Canary alert: never notify
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        # Info severity: never notify
        - receiver: 'null'
          matchers:
            - severity = "info"
        # Quiet hours (UTC 03:00-12:00 / 23:00-07:00 Eastern): suppress warning
        - receiver: 'null'
          time_intervals:
            - quiet-hours
          matchers:
            - severity = "warning"
        # Quiet hours (UTC 03:00-12:00 / 23:00-07:00 Eastern): critical still notifies
        - receiver: 'mattermost'
          time_intervals:
            - quiet-hours
          matchers:
            - severity = "critical"
        # All other hours: warning + critical notify
        - receiver: 'mattermost'
          matchers:
            - severity =~ "warning|critical"
    receivers:
      - name: 'null'
      - name: 'mattermost'
        webhook_configs:
          - url: 'http://mattermost-relay.monitoring.svc.cluster.local:8080/'
            send_resolved: true
            http_config:
              headers:
                X-Relay-Token: ${MONITORING_PROMETHEUS_RELAY_TOKEN}
    templates:
      - '/etc/alertmanager/config/*.tmpl'

grafana:
  enabled: true
  adminUser: admin
  adminPassword: ${MONITORING_PROMETHEUS_GRAFANA_ADMIN_PASSWORD}

prometheus:
  enabled: true
  route:
    main:
      enabled: true
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      hostnames: 
        - prometheus.${GLOBAL_DOMAIN}
      parentRefs:
        - name: gateway-api
          namespace: istio-gateway
      httpsRedirect: false
      matches:
        - path:
            type: PathPrefix
            value: /
