apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: relay-test
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: relay-test
      rules:
        - alert: RelayDeliveryTest
          expr: vector(1)
          for: 0s
          labels:
            severity: warning
          annotations:
            summary: "End-to-end test alert for the Mattermost relay — safe to ignore"
