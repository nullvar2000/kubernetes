apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfd
  namespace: node-feature-discovery
spec:
  interval: 1h
  timeout: 15m
  releaseName: nfd
  remediation:
    retries: 3
  chart:
    spec:
      chart: node-feature-discovery
      version: 'v0.20.*'
      sourceRef:
        kind: HelmRepository
        name: nfd
  values:
    prometheus:
      enable: true
