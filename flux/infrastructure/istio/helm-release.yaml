
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
spec:
  interval: 1h
  timeout: 15m
  releaseName: istio-base
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: base
      version: 1.28.10
      sourceRef:
        kind: HelmRepository
        name: istio
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
spec:
  interval: 1h
  dependsOn:
    - name: istio-base
  timeout: 15m
  releaseName: istiod
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: istiod
      version: 1.28.10
      sourceRef:
        kind: HelmRepository
        name: istio
  values:
    profile: ambient
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
spec:
  interval: 1h
  dependsOn:
    - name: istiod
  timeout: 15m
  releaseName: istio-cni
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: cni
      version: 1.28.10
      sourceRef:
        kind: HelmRepository
        name: istio
  values:
    profile: ambient
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ztunnel
spec:
  interval: 1h
  dependsOn:
    - name: istio-cni
  timeout: 15m
  releaseName: istio-ztunnel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ztunnel
      version: 1.28.10
      sourceRef:
        kind: HelmRepository
        name: istio
