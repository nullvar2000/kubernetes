apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 1h
  timeout: 15m
  releaseName: kyverno
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
    crds: CreateReplace
  chart:
    spec:
      chart: kyverno
      version: "3.10.*"
      sourceRef:
        kind: HelmRepository
        name: kyverno

  valuesFrom:
    - kind: ConfigMap
      name: helm-values
