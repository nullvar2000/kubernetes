# Grafana auto-import via the GrafanaOperator CRDs (you mentioned you have this)
grafana:
  enabled: true
  namespace: monitoring

prometheusRule:
  enabled: true
  spec: [] # Need to fill this out

admissionController:
  replicas: 2
  serviceMonitor:
    enabled: true

backgroundController:
  serviceMonitor:
    enabled: true

cleanupController:
  serviceMonitor:
    enabled: true

reportsController:
  serviceMonitor:
    enabled: true

# The chart 3.10 pre-upgrade gate job (kyverno-check-legacy-policies) defaults to
# activeDeadlineSeconds 120, which a cold pull of the kyverno-cli image alone
# exceeds (~70s observed 2026-11-18). Raise it; the gate itself stays enabled.
upgrade:
  legacyPolicyCheck:
    activeDeadlineSeconds: 600
